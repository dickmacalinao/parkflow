# Local development only. Production uses Neon (database) + Render (backend) + Cloudflare
# Pages (frontend) - see docs/06-deployment-guide.md.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: parkflow
    ports:
      - '5433:5432'
    volumes:
      - parkflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d parkflow']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: build
    command: ['sh', '-c', 'npx prisma migrate deploy && npm run seed']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/parkflow?schema=public
    restart: 'no'

  backend:
    build: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/parkflow?schema=public
      CLIENT_URL: http://localhost:5173
      JWT_ACCESS_SECRET: dev-access-secret-not-for-production
      JWT_REFRESH_SECRET: dev-refresh-secret-not-for-production
    ports:
      - '4000:4000'

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - '5173:5173'

volumes:
  parkflow_pg_data:
